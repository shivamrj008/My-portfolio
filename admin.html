<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Studio Admin Panel | Shivam Rajput</title>
    <link rel="icon" type="image/png" href="lc.png" />
    <link rel="stylesheet" href="admin.css" />
  </head>

  <body>
    <!-- Top Administrative Bar -->
    <header class="admin-header">
      <div class="admin-brand">
        <img src="lc.png" alt="Shivam Monogram" class="admin-logo" />
        <span class="admin-title">SHIVAM RAJPUT</span>
        <span class="admin-badge">STUDIO CMS</span>
      </div>

      <div class="admin-nav-actions">
        <a href="index.html" class="btn btn-sm btn-primary" target="_blank" rel="noopener noreferrer">
          VIEW LIVE SITE ↗
        </a>
        <button id="btn-export-json" class="btn btn-sm">
          EXPORT JSON
        </button>
        <button id="btn-reset-defaults" class="btn btn-sm">
          RESET DEFAULTS
        </button>
        <button id="btn-logout" class="btn btn-sm btn-danger">
          LOGOUT
        </button>
      </div>
    </header>

    <!-- Main Dashboard Container -->
    <main class="admin-container">
      <!-- Section 1: Hero & Profile Configuration -->
      <section class="admin-section">
        <div class="section-top">
          <div>
            <h2 class="section-headline">1. HERO &amp; PROFILE SETTINGS</h2>
            <p class="section-desc">Manage primary brand statements, hero punchline, and contact destinations.</p>
          </div>
        </div>

        <form id="profile-form" class="form-grid">
          <div class="form-group">
            <label for="field-hero-kicker" class="form-label">HERO KICKER BADGE</label>
            <input
              type="text"
              id="field-hero-kicker"
              class="form-control"
              placeholder="e.g. BUILDING DIGITAL EXPERIENCES"
              required
            />
          </div>

          <div class="form-group">
            <label for="field-email" class="form-label">DIRECT CONTACT EMAIL</label>
            <input
              type="email"
              id="field-email"
              class="form-control"
              placeholder="suburajput800@gmail.com"
              required
            />
          </div>

          <div class="form-group form-group-full">
            <label for="field-hero-tagline" class="form-label">HERO TAGLINE / ELEVATOR PITCH</label>
            <textarea
              id="field-hero-tagline"
              class="form-control"
              rows="3"
              placeholder="I design and develop modern websites that combine thoughtful design, clean code, and smooth interactions."
              required
            ></textarea>
          </div>

          <div class="form-group">
            <label for="field-hero-role" class="form-label">ROLE LABEL</label>
            <input
              type="text"
              id="field-hero-role"
              class="form-control"
              placeholder="WEB DEVELOPER"
              required
            />
          </div>

          <div class="form-group">
            <label for="field-hero-focus" class="form-label">FOCUS SPECIALIZATION</label>
            <input
              type="text"
              id="field-hero-focus"
              class="form-control"
              placeholder="CREATIVE DEVELOPER"
              required
            />
          </div>

          <div class="form-group">
            <label for="field-hero-location" class="form-label">BASE LOCATION</label>
            <input
              type="text"
              id="field-hero-location"
              class="form-control"
              placeholder="INDIA"
              required
            />
          </div>

          <div class="form-group" style="align-self: flex-end;">
            <button type="submit" class="btn btn-primary" style="width: 100%;">
              SAVE PROFILE SETTINGS &rarr;
            </button>
          </div>
        </form>
      </section>

      <!-- Section 2: Selected Projects Management -->
      <section class="admin-section">
        <div class="section-top">
          <div>
            <h2 class="section-headline">2. SELECTED WORK (PROJECTS)</h2>
            <p class="section-desc">Add new projects, update existing showcases, or re-order portfolio items.</p>
          </div>
          <button id="btn-add-project" class="btn btn-primary">
            + ADD NEW PROJECT
          </button>
        </div>

        <!-- Dynamic List of Projects -->
        <div id="admin-projects-list" class="projects-table">
          <!-- Populated dynamically via admin.js -->
        </div>
      </section>
    </main>

    <!-- Modal Dialog: Add / Edit Project -->
    <div id="project-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="modal-title" class="modal-title">ADD NEW PROJECT</h3>
          <button id="btn-close-modal" class="modal-close" aria-label="Close modal">&times;</button>
        </div>

        <form id="project-form">
          <div class="form-grid">
            <div class="form-group form-group-full">
              <label for="proj-title" class="form-label">PROJECT TITLE</label>
              <input
                type="text"
                id="proj-title"
                class="form-control"
                placeholder="e.g. NER LandslideGuard AI"
                required
              />
            </div>

            <div class="form-group">
              <label for="proj-category-index" class="form-label">CATEGORY INDEX BADGE</label>
              <input
                type="text"
                id="proj-category-index"
                class="form-control"
                placeholder="e.g. 05 / MACHINE LEARNING"
                required
              />
            </div>

            <div class="form-group">
              <label for="proj-category-type" class="form-label">APPLICATION TYPE</label>
              <input
                type="text"
                id="proj-category-type"
                class="form-control"
                placeholder="e.g. FULL-STACK WEB APP"
                required
              />
            </div>

            <div class="form-group">
              <label for="proj-preview-title" class="form-label">CARD PREVIEW HEADER</label>
              <input
                type="text"
                id="proj-preview-title"
                class="form-control"
                placeholder="e.g. Smart Crop Advisory"
              />
            </div>

            <div class="form-group">
              <label for="proj-preview-subtitle" class="form-label">CARD SUBTITLE / TAG</label>
              <input
                type="text"
                id="proj-preview-subtitle"
                class="form-control"
                placeholder="e.g. PRECISION AGRICULTURE"
              />
            </div>

            <div class="form-group form-group-full">
              <label for="proj-desc" class="form-label">PROJECT SUMMARY &amp; ARCHITECTURE</label>
              <textarea
                id="proj-desc"
                class="form-control"
                rows="4"
                placeholder="Describe the problem, technologies used, and outcomes..."
                required
              ></textarea>
            </div>

            <div class="form-group form-group-full">
              <label for="proj-tags" class="form-label">TECHNOLOGY STACK (COMMA SEPARATED)</label>
              <input
                type="text"
                id="proj-tags"
                class="form-control"
                placeholder="React, TypeScript, Node.js, WebSockets, Python"
                required
              />
            </div>

            <div class="form-group">
              <label for="proj-demo-link" class="form-label">LIVE DEMO / CASE STUDY LINK</label>
              <input
                type="text"
                id="proj-demo-link"
                class="form-control"
                placeholder="#contact or https://..."
              />
            </div>

            <div class="form-group">
              <label for="proj-code-link" class="form-label">SOURCE CODE / GITHUB LINK</label>
              <input
                type="text"
                id="proj-code-link"
                class="form-control"
                placeholder="https://github.com/..."
              />
            </div>
          </div>

          <div class="modal-footer" style="margin-top: 1.5rem;">
            <button type="button" id="btn-cancel-modal" class="btn btn-outline">CANCEL</button>
            <button type="submit" class="btn btn-primary">SAVE PROJECT &rarr;</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Toast Notification -->
    <div id="admin-toast" class="admin-toast" role="status" aria-live="polite"></div>

    <!-- Admin Interactive Script -->
    <script src="admin.js"></script>
  </body>
</html>
